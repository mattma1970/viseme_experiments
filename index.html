<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phenomes — viseme test head (M2)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14161c; color: #e8eaf0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #app { position: fixed; inset: 0; }
      #app canvas.webgl { display: block; width: 100%; height: 100%; }
      #ui {
        position: absolute; top: 12px; left: 12px; width: 320px;
        background: rgba(18, 20, 27, 0.88); border: 1px solid #2c303c; border-radius: 10px;
        padding: 14px 16px; font-size: 13px; line-height: 1.45; user-select: none;
      }
      #ui h1 { font-size: 14px; margin: 0 0 2px 0; letter-spacing: 0.4px; }
      #ui .sub { color: #8b93a7; font-size: 11px; margin-bottom: 10px; }
      #ui label { display: block; color: #8b93a7; font-size: 11px; margin-top: 8px; }
      #ui select, #ui button {
        width: 100%; box-sizing: border-box; margin-top: 3px;
        background: #232735; color: #e8eaf0; border: 1px solid #343a4a;
        border-radius: 6px; padding: 6px 8px; font-size: 13px;
      }
      #ui button { cursor: pointer; }
      #ui button:hover { background: #2c3145; }
      #ui .row { display: flex; gap: 8px; }
      #ui .row > * { flex: 1; }
      #time { margin-top: 8px; color: #b9c1d9; font-variant-numeric: tabular-nums; }
      #bars { margin-top: 8px; width: 100%; height: 132px; background: #191c25; border-radius: 6px; }
      #status { margin-top: 8px; color: #6f9e6f; font-size: 11px; min-height: 14px; }
      #wire { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: #8b93a7; }
      .sndrow { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: #8b93a7; }
      #voiceinfo { margin-top: 4px; font-size: 11px; color: #6d7488; }
      #neuralinfo { margin-top: 2px; font-size: 11px; color: #6d7488; }
      #dom { margin-top: 4px; font-size: 12px; color: #b9c1d9; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui">
      <h1>Phenomes · M2 test head</h1>
      <div class="sub">Kokoro-82M neural TTS (in-browser, WebGPU/WASM) → real word + viseme timings → viseme curves → Oculus morph targets. System voice stands in until the model is downloaded.</div>

      <label>Sample phoneme track</label>
      <select id="sample">
        <option value="/samples/sentence-1.json">“I think the cat and you should catch…”</option>
        <option value="/samples/sentence-2.json">“Blue moon, what do you mean?”</option>
      </select>

      <div class="row" style="margin-top:10px">
        <button id="play">▶ Play</button>
        <button id="pause">⏸ Pause</button>
        <button id="stop">⏹ Stop</button>
      </div>

      <div id="time">— / —</div>
      <canvas id="bars" width="580" height="264"></canvas>
      <div class="sndrow">
        <input type="checkbox" id="sound" checked /> 🔊 speak (Kokoro neural → system-voice fallback)
      </div>
      <div id="voiceinfo"></div>
      <div id="neuralinfo"></div>
      <div id="wire"><input type="checkbox" id="wireframe" /> show wireframe</div>
      <div id="dom">dominant: —</div>
      <div id="status"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
